name: cpu-matrix (0.5B brutal sweep, tasks x sidecar-arm x budget, no secrets)
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "space-separated task ids, or ALL"
        default: "rich_2943"
        required: true
      arms:
        description: "both | subset of nosidecar,sidecar"
        default: "both"
        required: true
      calls:
        description: "subset of 10,28"
        default: "10"
        required: true
jobs:
  mk:
    runs-on: ubuntu-latest
    outputs:
      mx: ${{ steps.m.outputs.mx }}
      n: ${{ steps.m.outputs.n }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          sel = "${{ inputs.tasks }}".strip()
          arms_in = "${{ inputs.arms }}".strip()
          calls_in = "${{ inputs.calls }}".strip()
          arms = ["nosidecar", "sidecar"] if arms_in == "both" else [a for a in arms_in.split(",") if a in ("nosidecar", "sidecar")]
          calls = [int(c) for c in calls_in.split(",") if c.strip() in ("10", "28")] or [10]
          rows = [json.loads(l) for l in open("cpu/tasks-all.jsonl") if l.strip()]
          idset = {r["id"] for r in rows}
          ids = [r["id"] for r in rows] if sel == "ALL" else [t for t in sel.split() if t in idset]
          mx = [{"task": t, "arm": a, "calls": c} for t in ids for a in arms for c in calls]
          print("mx=" + json.dumps(mx))
          print("n=" + str(len(mx)))
          PYEOF
  run:
    needs: mk
    if: needs.mk.outputs.n != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mk.outputs.mx) }}
    steps:
      - uses: actions/checkout@v4
      - name: pick task
        run: |
          grep "\"id\":\"${{ matrix.task }}\"" cpu/tasks-all.jsonl | head -1 > /tmp/task.json
          test -s /tmp/task.json || { echo "unknown task"; exit 1; }
          python3 -c "import json;t=json.load(open('/tmp/task.json'));print(t['id'],t['repo'],t['base_commit'][:8])"
          python3 -c "import json;t=json.load(open('/tmp/task.json'));json.dump({'id':t['id'],'repo':t['repo'],'problem_statement':t['problem_statement']},open('/tmp/task-agent.json','w'))"
      - name: model server wheel (pinned 0.2.62, CPU, no build)
        run: |
          python3 --version
          pip install -q "llama-cpp-python[server]==0.2.62" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python3 -c "import llama_cpp, llama_cpp.server; print('server ok', llama_cpp.__version__)"
      - name: small weights (first success wins, ~400MB)
        run: |
          pip install -q "huggingface_hub[cli]"
          (hf download bartowski/Qwen2.5-0.5B-Instruct-GGUF Qwen2.5-0.5B-Instruct-Q4_K_M.gguf --local-dir weights/ 2>&1 | tail -1) || \
          hf download Qwen/Qwen2.5-0.5B-Instruct-GGUF qwen2.5-0.5b-instruct-q4_k_m.gguf --local-dir weights/ 2>&1 | tail -1
          ls -la weights/
      - name: serve on :8000 (CPU, ctx 4096)
        run: |
          python3 -m llama_cpp.server --model $(echo weights/*.gguf) --host 127.0.0.1 --port 8000 --n_ctx 4096 --n_threads 4 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/v1/models && break || sleep 10; done
      - name: task repo at base commit (public, no auth)
        run: |
          REPO=$(python3 -c "import json;print(json.load(open('/tmp/task.json'))['repo'])")
          BASE=$(python3 -c "import json;print(json.load(open('/tmp/task.json'))['base_commit'])")
          git clone --quiet "https://github.com/${REPO}.git" /tmp/ws
          git -C /tmp/ws checkout --quiet "$BASE"
          git -C /tmp/ws log --oneline -1
      - name: sidecar index (sidecar arm only)
        if: matrix.arm == 'sidecar'
        run: |
          python3 cpu/sidecar.py --ws /tmp/ws --out sidecar/index.json
      - name: agent
        run: |
          node --version
          PROMPT=cpu/prompt-mini.md; SC=""
          if [ "${{ matrix.arm }}" = "sidecar" ]; then PROMPT=cpu/prompt-sidecar.md; SC="--sidecar-index sidecar/index.json"; fi
          sed "s/max 10 calls/max ${{ matrix.calls }} calls/" "$PROMPT" > /tmp/prompt.md
          node cpu/smoke-agent.mjs --ws /tmp/ws --task /tmp/task-agent.json --prompt /tmp/prompt.md --url http://localhost:8000/v1/chat/completions --max-calls ${{ matrix.calls }} --arm "${{ matrix.arm }}-${{ matrix.calls }}" $SC --out results/
      - name: grade (L0..L3 ladder)
        run: |
          pip install -q pytest
          (cd /tmp/ws && pip install -q -e . 2>&1 | tail -1) || true
          WS=/tmp/ws RES=results TASK_JSON=/tmp/task.json bash cpu/grade.sh 2>&1 | tee results/grade.log
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-mat-${{ matrix.task }}-${{ matrix.arm }}-${{ matrix.calls }}-${{ github.run_id }}
          path: |
            results/
            server.log
            sidecar/
