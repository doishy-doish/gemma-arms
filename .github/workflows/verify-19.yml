name: verify-19
on:
  workflow_dispatch:
    inputs:
      rows:
        description: "rows"
        default: "all"
        required: true
  push:
    paths: ["verify-19/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        row: [fastapi_13920]
        patch_set: [agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: echo setup-python-ok
