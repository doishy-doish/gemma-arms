name: verify-19
on:
  workflow_dispatch:
    inputs:
      rows:
        description: "rows"
        default: "all"
        required: true
  push:
    paths: ["verify-19/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        row: [fastapi_13920, fastapi_14258, fastapi_14479, fastapi_15589, fastapi_5077, fastapi_9425, requests_6589, requests_6592, requests_7205, requests_7309, requests_7315, requests_7328, requests_7427, requests_7433, rich_3296, fastapi_11355, fastapi_14303, fastapi_14430, requests_6629]
        patch_set: [agent, gold]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pytest
      - run: python3 verify-19/verify_run.py --row ${{ matrix.row }} --patch-set ${{ matrix.patch_set }}
