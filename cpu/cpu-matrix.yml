name: cpu-matrix (0.5B brutal sweep, tasks x sidecar-arm x budget, no secrets)
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "space-separated task ids, or ALL"
        default: "rich_2943"
        required: true
      arms:
        description: "both | subset of nosidecar,sidecar,inject,floor32,qplus"
        default: "both"
        required: true
      calls:
        description: "subset of 10,28"
        default: "10"
        required: true
      model:
        description: "qwen05b | qwen14b | rail (duck.ai gemma4-31b browser rail)"
        default: "qwen05b"
        required: true
jobs:
  mk:
    runs-on: ubuntu-latest
    outputs:
      mx: ${{ steps.m.outputs.mx }}
      n: ${{ steps.m.outputs.n }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          sel = "${{ inputs.tasks }}".strip()
          arms_in = "${{ inputs.arms }}".strip()
          calls_in = "${{ inputs.calls }}".strip()
          arms = ["nosidecar", "sidecar", "inject"] if arms_in == "both" else [a for a in arms_in.split(",") if a in ("nosidecar", "sidecar", "inject", "floor32", "qplus")]
          calls = [int(c) for c in calls_in.split(",") if c.strip() in ("10", "28")] or [10]
          rows = [json.loads(l) for l in open("cpu/tasks-all.jsonl") if l.strip()]
          idset = {r["id"] for r in rows}
          ids = [r["id"] for r in rows] if sel == "ALL" else [t for t in sel.split() if t in idset]
          mx = [{"task": t, "arm": a, "calls": c} for t in ids for a in arms for c in calls]
          print("mx=" + json.dumps(mx))
          print("n=" + str(len(mx)))
          PYEOF
  run:
    needs: mk
    if: needs.mk.outputs.n != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mk.outputs.mx) }}
    steps:
      - uses: actions/checkout@v4
      - name: pick task
        run: |
          grep "\"id\":\"${{ matrix.task }}\"" cpu/tasks-all.jsonl | head -1 > /tmp/task.json
          test -s /tmp/task.json || { echo "unknown task"; exit 1; }
          python3 -c "import json;t=json.load(open('/tmp/task.json'));print(t['id'],t['repo'],t['base_commit'][:8])"
          python3 -c "import json;t=json.load(open('/tmp/task.json'));json.dump({'id':t['id'],'repo':t['repo'],'problem_statement':t['problem_statement']},open('/tmp/task-agent.json','w'))"
          python3 -c "import json;t=json.load(open('/tmp/task.json'));open('/tmp/issue.txt','w').write(t['problem_statement'])"
          python3 -c "import json;t=json.load(open('/tmp/task.json'));print(' '.join(t.get('test_files') or []))" > /tmp/test-files.txt
      - name: model server wheel (pinned 0.2.62, CPU, no build)
        if: inputs.model != 'rail'
        run: |
          python3 --version
          pip install -q "llama-cpp-python[server]==0.2.62" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python3 -c "import llama_cpp, llama_cpp.server; print('server ok', llama_cpp.__version__)"
      - name: weights (model input; 14B Q4 ~8.6GB, disk/RAM ceiling)
        if: inputs.model != 'rail'
        run: |
          pip install -q "huggingface_hub[cli]"
          df -h / | tail -1
          if [ "${{ inputs.model }}" = "qwen14b" ]; then
            (hf download bartowski/Qwen2.5-14B-Instruct-GGUF Qwen2.5-14B-Instruct-Q4_K_M.gguf --local-dir weights/ 2>&1 | tail -2) || \
            hf download Qwen/Qwen2.5-14B-Instruct-GGUF --local-dir weights/ --include "qwen2.5-14b-instruct-q4_k_m*" 2>&1 | tail -2
          else
            (hf download Qwen/Qwen2.5-0.5B-Instruct-GGUF qwen2.5-0.5b-instruct-q4_k_m.gguf --local-dir weights/ 2>&1 | tail -1) || \
            hf download bartowski/Qwen2.5-0.5B-Instruct-GGUF Qwen2.5-0.5B-Instruct-Q4_K_M.gguf --local-dir weights/ 2>&1 | tail -1
          fi
          ls -la weights/
          df -h / | tail -1
      - name: serve on :8000 (llama CPU, or duck-rail shim when model=rail)
        run: |
          if [ "${{ inputs.model }}" = "rail" ]; then
            pip install -q playwright
            nohup python3 cpu/duck-rail-test/rail_shim.py > server.log 2>&1 &
          else
            python3 -m llama_cpp.server --model $(ls weights/*.gguf | head -1) --host 127.0.0.1 --port 8000 --n_ctx 8192 --n_threads 4 > server.log 2>&1 &
          fi
          for i in $(seq 1 60); do curl -sf http://localhost:8000/v1/models && break || sleep 10; done
          curl -sf http://localhost:8000/v1/models > /dev/null || { echo "SERVER-NEVER-UP"; tail -30 server.log; exit 1; }
      - name: task repo at base commit (public, no auth)
        run: |
          REPO=$(python3 -c "import json;print(json.load(open('/tmp/task.json'))['repo'])")
          BASE=$(python3 -c "import json;print(json.load(open('/tmp/task.json'))['base_commit'])")
          git clone --quiet "https://github.com/${REPO}.git" /tmp/ws
          git -C /tmp/ws checkout --force --quiet "$BASE"
          git -C /tmp/ws clean -fdx -q || true
          git -C /tmp/ws log --oneline -1
      - name: "task deps (pre-install: mid-run grade checks need them)"
        run: |
          pip install -q pytest httpx
          (cd /tmp/ws && pip install -q -e . 2>&1 | tail -1) || true
      - name: sidecar index (sidecar/inject arms only)
        if: matrix.arm == 'sidecar' || matrix.arm == 'inject'
        run: |
          python3 cpu/sidecar.py --ws /tmp/ws --out sidecar/index.json
      - name: lint (py_compile both harnesses, fail fast on syntax)
        run: |
          python3 -m py_compile cpu/kaggle-harness.py cpu/sidecar.py && echo LINT-OK
      - name: agent
        run: |
          node --version
          PROMPT=cpu/prompt-mini.md; SC=""
          if [ "${{ matrix.arm }}" = "sidecar" ]; then PROMPT=cpu/prompt-sidecar.md; SC="--sidecar-index sidecar/index.json"; fi
          if [ "${{ matrix.arm }}" = "floor32" ]; then PROMPT=cpu/prompt-floor32.md; SC=""; fi
          if [ "${{ matrix.arm }}" = "inject" ]; then PROMPT=cpu/prompt-inject.md; SC="--sidecar-index sidecar/index.json"; fi
          if [ "${{ matrix.arm }}" = "qplus" ]; then PROMPT=cpu/prompt-qplus.md; SC=""; fi
          sed "s/__MAXCALLS__/${{ matrix.calls }}/" "$PROMPT" > /tmp/prompt.md
          if [ "${{ matrix.arm }}" = "inject" ]; then { echo; echo "CANDIDATE EDITS (verify by READ first):"; python3 cpu/sidecar.py --ws /tmp/ws --issue-file /tmp/issue.txt --topk 3 --emit-candidates 2>/dev/null || true; } >> /tmp/prompt.md; fi
          node cpu/smoke-agent.mjs --ws /tmp/ws --task /tmp/task-agent.json --prompt /tmp/prompt.md --url http://localhost:8000/v1/chat/completions --max-calls ${{ matrix.calls }} --test-files "$(cat /tmp/test-files.txt)" --arm "${{ matrix.arm }}-${{ matrix.calls }}" $SC --out results/
      - name: tree state (D16 clean-tree evidence)
        if: always()
        run: |
          git -C /tmp/ws status --porcelain=v1 | head -20 > results/tree-state.txt || true
          echo "$GITHUB_SHA" > results/harness-sha.txt
      - name: grade (L0..L3 ladder)
        run: |
          pip install -q pytest
          (cd /tmp/ws && pip install -q -e . 2>&1 | tail -1) || true
          WS=/tmp/ws RES=results TASK_JSON=/tmp/task.json bash cpu/grade.sh 2>&1 | tee results/grade.log
      - name: spectrum (partial-credit gauge, never fails the job)
        if: always()
        run: |
          node cpu/spectrum.js --res results || true
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-mat-${{ matrix.task }}-${{ matrix.arm }}-${{ matrix.calls }}-${{ github.run_id }}
          path: |
            results/
            server.log
            sidecar/
